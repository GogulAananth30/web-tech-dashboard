<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Corner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <h2>Food Corner</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Offers</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Welcome to Food Corner</h1>
        <p>Fresh, Delicious & Affordable Food</p>
        <button>Order Now</button>
    </section>

    <!-- Food Cards -->
    <section class="foods">

        <div class="card">
            <img src="images/pizza.jfif" alt="Pizza">
            <h3>Pizza</h3>
        </div>

        <div class="card">
            <img src="images/burger.jfif" alt="Pasta">
            <h3>Pasta</h3>
        </div>

        <div class="card">
            <img src="images/pasta.jfif" alt="sandwich">
            <h3>Sandwich</h3>
        </div>

        <div class="card">
            <img src="images/sandwich.jfif" alt="burger">
            <h3>Burger</h3>
        </div>

    </section>

    <footer>
        <p>© 2026 Food Corner | All Rights Reserved</p>
    </footer>

</body>
</html>
